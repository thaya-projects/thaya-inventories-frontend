<div class="relative">
  <button
    type="button"
    (click)="toggle()"
    aria-label="Menú de usuario"
    [title]="userName()"
    class="flex h-8 w-8 shrink-0 cursor-pointer items-center justify-center rounded-full bg-gr-primary-dark text-[12px] font-bold text-gr-primary-lite transition hover:brightness-95"
  >
    {{ getInitial() }}
  </button>

  @if (open()) {
    <div class="fixed inset-0 z-40" (click)="close()"></div>

    <div class="absolute top-full right-0 z-50 mt-2 w-56 rounded-lg border border-gr-border bg-gr-surface shadow-lg">
      <div class="border-b border-gr-border-lite px-4 py-3">
        <p class="truncate text-sm font-semibold text-gr-text">{{ userName() }}</p>
        <p class="truncate text-xs text-gr-muted">{{ userEmail() }}</p>
      </div>

      <div class="py-1.5">
        <a
          routerLink="/profile"
          (click)="close()"
          class="flex items-center gap-2.5 px-4 py-2 text-sm text-gr-text transition-colors hover:bg-gr-bg"
        >
          <svg class="h-4 w-4 text-gr-muted" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          Ver perfil
        </a>
        <button
          type="button"
          (click)="logout()"
          class="flex w-full cursor-pointer items-center gap-2.5 px-4 py-2 text-left text-sm text-gr-danger transition-colors hover:bg-gr-danger-bg"
        >
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          Cerrar sesión
        </button>
      </div>
    </div>
  }
</div>
