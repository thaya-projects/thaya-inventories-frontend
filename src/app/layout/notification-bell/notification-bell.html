<div class="relative">
  <button
    type="button"
    (click)="toggle()"
    aria-label="Notificaciones"
    class="relative flex h-9 w-9 shrink-0 cursor-pointer items-center justify-center rounded-full text-gr-sub transition-colors hover:bg-gr-bg hover:text-gr-text"
  >
    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
      <path d="M13.73 21a2 2 0 01-3.46 0"/>
    </svg>
    @if (unreadCount() > 0) {
      <span class="absolute top-0.5 right-0.5 flex h-4 min-w-4 items-center justify-center rounded-full bg-gr-danger px-1 text-[10px] font-bold text-gr-primary-lite">
        {{ badge() }}
      </span>
    }
  </button>

  @if (open()) {
    <div class="fixed inset-0 z-40" (click)="close()"></div>

    <div class="absolute top-full right-0 z-50 mt-2 w-80 rounded-lg border border-gr-border bg-gr-surface shadow-lg">
      <div class="flex items-center justify-between border-b border-gr-border-lite px-4 py-3">
        <span class="text-sm font-semibold text-gr-text">Notificaciones</span>
        <a routerLink="/notifications" (click)="close()" class="text-xs font-medium text-gr-primary transition hover:text-gr-gold">
          Ver todas
        </a>
      </div>

      <div class="max-h-96 overflow-y-auto">
        @if (loading()) {
          <p class="px-4 py-6 text-center text-sm text-gr-sub">Cargando...</p>
        } @else if (items().length === 0) {
          <p class="px-4 py-6 text-center text-sm text-gr-sub">No hay notificaciones.</p>
        } @else {
          @for (n of items(); track n.id) {
            <button
              type="button"
              (click)="selectItem(n)"
              class="flex w-full cursor-pointer items-start gap-2.5 border-b border-gr-border-lite px-4 py-3 text-left transition-colors last:border-b-0 hover:bg-gr-bg"
              [class]="n.isRead ? '' : 'bg-gr-primary-lite/10'"
            >
              <span class="mt-1.5 h-2 w-2 shrink-0 rounded-full" [class]="dotClass(n.type)"></span>
              <span class="min-w-0 flex-1">
                <span class="block truncate text-sm" [class]="n.isRead ? 'font-medium text-gr-sub' : 'font-semibold text-gr-text'">
                  {{ n.title }}
                </span>
                <span class="mt-0.5 block truncate text-xs text-gr-muted">{{ n.message }}</span>
              </span>
            </button>
          }
        }
      </div>
    </div>
  }
</div>
