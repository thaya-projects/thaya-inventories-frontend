<div class="mb-8 flex flex-wrap items-center justify-between gap-4">
  <div>
    <h1 class="text-2xl font-bold text-gr-text">Proveedores</h1>
    <p class="mt-1 text-gr-sub">Proveedores de tu empresa.</p>
  </div>
  <button
    type="button"
    (click)="openCreateModal()"
    class="cursor-pointer rounded-sm bg-gr-primary-dark px-4 py-2.5 font-semibold text-gr-primary-lite transition hover:brightness-95"
  >
    + Nuevo proveedor
  </button>
</div>

@if (showFormModal()) {
  <app-supplier-form-modal [supplierId]="editingSupplierId()" (close)="closeFormModal()" (saved)="onSupplierSaved()" />
}

<div class="mb-6 flex flex-wrap items-center gap-4">
  <app-search-input
    placeholder="Buscar por nombre..."
    [value]="search()"
    (valueChange)="onSearch($event)"
  />

  <div class="flex gap-2">
    <button
      type="button" (click)="setFilter('all')"
      class="cursor-pointer rounded-sm px-3.5 py-2 text-sm font-medium transition-colors"
      [class]="statusFilter() === 'all' ? 'bg-gr-primary-dark text-gr-primary-lite' : 'text-gr-sub hover:bg-gr-bg'"
    >
      Todos
    </button>
    <button
      type="button" (click)="setFilter('active')"
      class="cursor-pointer rounded-sm px-3.5 py-2 text-sm font-medium transition-colors"
      [class]="statusFilter() === 'active' ? 'bg-gr-primary-dark text-gr-primary-lite' : 'text-gr-sub hover:bg-gr-bg'"
    >
      Activos
    </button>
    <button
      type="button" (click)="setFilter('inactive')"
      class="cursor-pointer rounded-sm px-3.5 py-2 text-sm font-medium transition-colors"
      [class]="statusFilter() === 'inactive' ? 'bg-gr-primary-dark text-gr-primary-lite' : 'text-gr-sub hover:bg-gr-bg'"
    >
      Inactivos
    </button>
  </div>
</div>

@if (errorMessage()) {
  <div class="mb-6 rounded-sm border border-gr-danger/20 bg-gr-danger-bg px-4 py-3 text-sm text-gr-danger">
    {{ errorMessage() }}
  </div>
}

@if (loading()) {
  <p class="text-gr-sub">Cargando proveedores...</p>
} @else {
  <app-data-table [columns]="columns()" [rows]="suppliers()" emptyMessage="No hay proveedores registrados todavía." />
}

<ng-template #activeTpl let-supplier>
  @if (supplier.isActive) {
    <span class="rounded-full bg-gr-success-bg px-3 py-1 text-xs font-medium text-gr-success">Activo</span>
  } @else {
    <span class="rounded-full bg-gr-danger-bg px-3 py-1 text-xs font-medium text-gr-danger">Inactivo</span>
  }
</ng-template>

<ng-template #actionsTpl let-supplier>
  <div class="flex items-center justify-end gap-3">
    <button type="button" (click)="openEditModal(supplier)" class="cursor-pointer text-sm font-medium text-gr-primary transition hover:text-gr-gold">
      Editar
    </button>
    <button
      type="button"
      (click)="askToggleActive(supplier)"
      [disabled]="updatingId() === supplier.id"
      class="cursor-pointer text-sm font-medium transition disabled:cursor-not-allowed disabled:opacity-50"
      [class]="supplier.isActive ? 'text-gr-danger hover:brightness-90' : 'text-gr-success hover:brightness-90'"
    >
      {{ supplier.isActive ? 'Desactivar' : 'Activar' }}
    </button>
  </div>
</ng-template>

@if (toggleTarget(); as supplier) {
  <app-confirm-dialog
    [title]="supplier.isActive ? 'Desactivar proveedor' : 'Activar proveedor'"
    [message]="(supplier.isActive ? '¿Desactivar el proveedor \'' : '¿Activar el proveedor \'') + supplier.name + '\'?'"
    [confirmLabel]="supplier.isActive ? 'Desactivar' : 'Activar'"
    cancelLabel="Volver"
    [danger]="supplier.isActive"
    [working]="updatingId() === supplier.id"
    (close)="closeToggleConfirm()"
    (confirmed)="confirmToggleActive()"
  />
}
