<nav class="mb-6 flex flex-wrap items-center gap-x-6 gap-y-3 border-b border-gr-border-lite">
  <a
    routerLink="/inventory/products"
    class="flex items-center gap-1.5 border-b-2 pb-3 text-sm font-medium transition"
    [class]="active() === 'products' ? 'border-gr-primary-dark text-gr-text' : 'border-transparent text-gr-muted hover:text-gr-text'"
  >
    <svg class="h-4 w-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 8l-9-5-9 5 9 5 9-5z"/>
      <path d="M3 8v8l9 5 9-5V8"/>
      <path d="M12 13v8"/>
    </svg>
    Productos
  </a>
  <a
    routerLink="/inventory/movements"
    class="flex items-center gap-1.5 border-b-2 pb-3 text-sm font-medium transition"
    [class]="active() === 'movements' ? 'border-gr-primary-dark text-gr-text' : 'border-transparent text-gr-muted hover:text-gr-text'"
  >
    <svg class="h-4 w-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 7h10M7 7l3-3M7 7l3 3M17 17H7M17 17l-3-3M17 17l-3 3"/>
    </svg>
    Movimientos
  </a>
  <a
    routerLink="/inventory/categories"
    class="flex items-center gap-1.5 border-b-2 pb-3 text-sm font-medium transition"
    [class]="active() === 'categories' ? 'border-gr-primary-dark text-gr-text' : 'border-transparent text-gr-muted hover:text-gr-text'"
  >
    <svg class="h-4 w-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20.59 13.41L13.42 20.58a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/>
      <circle cx="7" cy="7" r="1.2" fill="currentColor" stroke="none"/>
    </svg>
    Categorías
  </a>
  <a
    routerLink="/inventory/units"
    class="flex items-center gap-1.5 border-b-2 pb-3 text-sm font-medium transition"
    [class]="active() === 'units' ? 'border-gr-primary-dark text-gr-text' : 'border-transparent text-gr-muted hover:text-gr-text'"
  >
    <svg class="h-4 w-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="9" width="18" height="6" rx="1"/>
      <path d="M7 9v3M11 9v3M15 9v3"/>
    </svg>
    Unidades
  </a>
  @if (showWarehouses()) {
    <a
      routerLink="/inventory/warehouses"
      class="flex items-center gap-1.5 border-b-2 pb-3 text-sm font-medium transition"
      [class]="active() === 'warehouses' ? 'border-gr-primary-dark text-gr-text' : 'border-transparent text-gr-muted hover:text-gr-text'"
    >
      <svg class="h-4 w-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 21V9l9-6 9 6v12"/>
        <path d="M9 21v-7h6v7"/>
      </svg>
      Almacenes
    </a>
  }
</nav>
