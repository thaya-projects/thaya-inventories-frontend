<div class="flex items-center justify-between gap-3 border-b border-gr-border-lite py-3 last:border-b-0" [class]="indentClass()">
  <div class="flex min-w-0 items-center gap-3">
    @if (depth() > 0) {
      <svg class="h-4 w-4 shrink-0 text-gr-muted" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4v8a4 4 0 0 0 4 4h8"/></svg>
    }
    <button
      type="button" (click)="edit.emit(category())"
      [attr.aria-label]="(category().imageUrl ? 'Cambiar foto de ' : 'Agregar foto a ') + category().name"
      class="flex h-11 w-11 shrink-0 cursor-pointer items-center justify-center overflow-hidden rounded-md transition"
      [class]="category().imageUrl ? 'bg-gr-bg ring-1 ring-gr-border-lite ring-inset' : 'border border-dashed border-gr-border bg-gr-bg text-gr-muted hover:border-gr-primary hover:text-gr-primary'"
    >
      @if (category().imageUrl; as url) {
        <img [src]="url" alt="" class="h-full w-full object-contain p-1" [class.opacity-50]="!category().isActive">
      } @else {
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="m21 16-5-5-9 9"/>
        </svg>
      }
    </button>
    <div class="min-w-0">
      <p class="truncate font-medium" [class]="category().isActive ? 'text-gr-text' : 'text-gr-sub'">{{ category().name }}</p>
      <div class="mt-1 flex min-w-0 items-center gap-2">
        @if (category().isActive) {
          <span class="inline-flex shrink-0 items-center gap-1.5 rounded-full bg-gr-success-bg px-2 py-0.5 text-xs font-medium text-gr-success">
            <span class="h-1.5 w-1.5 rounded-full bg-gr-success" aria-hidden="true"></span>Activa
          </span>
        } @else {
          <span class="inline-flex shrink-0 items-center gap-1.5 rounded-full bg-gr-border-lite px-2 py-0.5 text-xs font-medium text-gr-sub">
            <span class="h-1.5 w-1.5 rounded-full bg-gr-muted" aria-hidden="true"></span>Inactiva
          </span>
        }
        @if (!category().isActive) {
          <span class="truncate text-xs text-gr-sub">No se muestra en la tienda</span>
        } @else if (!category().imageUrl) {
          <span class="truncate text-xs text-gr-sub">Sin foto</span>
        }
      </div>
    </div>
  </div>

  <div class="flex shrink-0 items-center gap-3">
    <button type="button" (click)="edit.emit(category())" class="cursor-pointer text-sm font-medium text-gr-primary transition hover:text-gr-gold">
      Editar
    </button>
    <button
      type="button"
      (click)="toggleActive.emit(category())"
      [disabled]="updatingId() === category().id"
      class="cursor-pointer text-sm font-medium transition disabled:cursor-not-allowed disabled:opacity-50"
      [class]="category().isActive ? 'text-gr-sub hover:text-gr-danger' : 'text-gr-success hover:brightness-90'"
    >
      {{ category().isActive ? 'Desactivar' : 'Activar' }}
    </button>
  </div>
</div>

@for (child of category().children; track child.id) {
  <app-category-tree-node
    [category]="child"
    [depth]="depth() + 1"
    [updatingId]="updatingId()"
    (edit)="edit.emit($event)"
    (toggleActive)="toggleActive.emit($event)"
  />
}
