<div class="mb-8 flex flex-wrap items-center justify-between gap-4">
  <div>
    <h1 class="text-2xl font-bold text-gr-text">Dashboard</h1>
    <p class="mt-1 text-gr-sub">Resumen general de la plataforma.</p>
  </div>
  <a
    routerLink="/companies/new"
    class="rounded-sm bg-gr-primary-dark px-4 py-2.5 font-semibold text-gr-primary-lite transition hover:brightness-95"
  >
    + Nueva empresa
  </a>
</div>

@if (errorMessage()) {
  <div class="mb-6 rounded-sm border border-gr-danger/20 bg-gr-danger-bg px-4 py-3 text-sm text-gr-danger">
    {{ errorMessage() }}
  </div>
}

@if (loading()) {
  <p class="text-gr-sub">Cargando...</p>
} @else {
  <div class="grid grid-cols-1 gap-4 sm:grid-cols-3">
    <app-stat-card label="Empresas activas" [value]="activeCount()" tone="success" />
    <app-stat-card label="Trials por vencer" [value]="trialsExpiringCount()" tone="warning" />
    <app-stat-card label="Suscripciones vencidas / expiradas" [value]="pastDueCount()" tone="danger" />
  </div>
}
