<app-modal [title]="customerId() ? 'Editar cliente' : 'Nuevo cliente'" size="md" (close)="close.emit()">
  @if (errorMessage()) {
    <div class="mb-6 rounded-sm border border-gr-danger/20 bg-gr-danger-bg px-4 py-3 text-sm text-gr-danger">
      {{ errorMessage() }}
    </div>
  }

  @if (loading()) {
    <p class="text-gr-sub">Cargando...</p>
  } @else {
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="space-y-4">
        <div>
          <label for="name" class="mb-1.5 block text-sm font-medium text-gr-sub">Nombre</label>
          <input
            id="name" type="text" formControlName="name" placeholder="Ej. Juan Pérez"
            class="w-full rounded-sm border border-gr-border bg-gr-surface px-4 py-2.5 text-gr-text placeholder-gr-muted transition focus:border-gr-primary focus:outline-none focus:ring-2 focus:ring-gr-primary/30"
          >
          @if (form.controls.name.invalid && form.controls.name.touched) {
            <p class="mt-1.5 text-xs text-gr-danger">El nombre es obligatorio.</p>
          }
        </div>

        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
          <div>
            <label for="phone" class="mb-1.5 block text-sm font-medium text-gr-sub">Teléfono (opcional)</label>
            <input
              id="phone" type="text" formControlName="phone"
              class="w-full rounded-sm border border-gr-border bg-gr-surface px-4 py-2.5 text-gr-text transition focus:border-gr-primary focus:outline-none focus:ring-2 focus:ring-gr-primary/30"
            >
          </div>
          <div>
            <label for="email" class="mb-1.5 block text-sm font-medium text-gr-sub">Correo (opcional)</label>
            <input
              id="email" type="email" formControlName="email"
              class="w-full rounded-sm border border-gr-border bg-gr-surface px-4 py-2.5 text-gr-text transition focus:border-gr-primary focus:outline-none focus:ring-2 focus:ring-gr-primary/30"
            >
          </div>
        </div>

        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
          <div>
            <label for="city" class="mb-1.5 block text-sm font-medium text-gr-sub">Ciudad (opcional)</label>
            <input
              id="city" type="text" formControlName="city"
              class="w-full rounded-sm border border-gr-border bg-gr-surface px-4 py-2.5 text-gr-text transition focus:border-gr-primary focus:outline-none focus:ring-2 focus:ring-gr-primary/30"
            >
          </div>
          <div>
            <label for="taxId" class="mb-1.5 block text-sm font-medium text-gr-sub">NIT (opcional)</label>
            <input
              id="taxId" type="text" formControlName="taxId"
              class="w-full rounded-sm border border-gr-border bg-gr-surface px-4 py-2.5 text-gr-text transition focus:border-gr-primary focus:outline-none focus:ring-2 focus:ring-gr-primary/30"
            >
          </div>
        </div>

        <div>
          <label for="address" class="mb-1.5 block text-sm font-medium text-gr-sub">Dirección (opcional)</label>
          <input
            id="address" type="text" formControlName="address"
            class="w-full rounded-sm border border-gr-border bg-gr-surface px-4 py-2.5 text-gr-text transition focus:border-gr-primary focus:outline-none focus:ring-2 focus:ring-gr-primary/30"
          >
        </div>
      </div>

      <div class="mt-8 flex items-center justify-end gap-3 border-t border-gr-border-lite pt-5">
        <button type="button" (click)="close.emit()" class="rounded-sm px-4 py-2.5 font-medium text-gr-sub transition hover:text-gr-text">
          Cancelar
        </button>
        <button
          type="submit"
          [disabled]="submitting()"
          class="flex items-center gap-2 rounded-sm bg-gr-primary-dark px-5 py-2.5 font-semibold text-gr-primary-lite transition hover:brightness-95 disabled:cursor-not-allowed disabled:opacity-60"
        >
          @if (submitting()) {
            <svg class="h-4 w-4 animate-spin" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
            </svg>
            Guardando…
          } @else {
            {{ customerId() ? 'Guardar cambios' : 'Crear cliente' }}
          }
        </button>
      </div>
    </form>
  }
</app-modal>
