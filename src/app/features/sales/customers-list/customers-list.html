<div class="mb-6 flex flex-col items-start gap-4 sm:flex-row sm:items-center sm:justify-between">
  <div>
    <h1 class="text-2xl font-bold text-gr-text">Clientes</h1>
    <p class="mt-1 text-gr-sub">Clientes de tu empresa.</p>
  </div>
  <button
    type="button"
    (click)="openCreateModal()"
    class="cursor-pointer rounded-sm bg-gr-primary-dark px-4 py-2.5 font-semibold text-gr-primary-lite transition hover:brightness-95"
  >
    + Nuevo cliente
  </button>
</div>

<app-sales-tabs active="customers" />

@if (showFormModal()) {
  <app-customer-form-modal [customerId]="editingCustomerId()" (close)="closeFormModal()" (saved)="onCustomerSaved()" />
}

<div class="mb-6 flex flex-wrap items-center gap-4">
  <app-search-input
    placeholder="Buscar por nombre, NIT/CI o teléfono..."
    [value]="search()"
    (valueChange)="onSearch($event)"
  />

  <div class="flex gap-2">
    <button
      type="button" (click)="setFilter('all')"
      class="cursor-pointer rounded-sm px-3.5 py-2 text-sm font-medium transition-colors"
      [class]="statusFilter() === 'all' ? 'bg-gr-primary-dark text-gr-primary-lite' : 'text-gr-sub hover:bg-gr-bg'"
    >
      Todos
    </button>
    <button
      type="button" (click)="setFilter('active')"
      class="cursor-pointer rounded-sm px-3.5 py-2 text-sm font-medium transition-colors"
      [class]="statusFilter() === 'active' ? 'bg-gr-primary-dark text-gr-primary-lite' : 'text-gr-sub hover:bg-gr-bg'"
    >
      Activos
    </button>
    <button
      type="button" (click)="setFilter('inactive')"
      class="cursor-pointer rounded-sm px-3.5 py-2 text-sm font-medium transition-colors"
      [class]="statusFilter() === 'inactive' ? 'bg-gr-primary-dark text-gr-primary-lite' : 'text-gr-sub hover:bg-gr-bg'"
    >
      Inactivos
    </button>
  </div>
</div>

@if (errorMessage()) {
  <div class="mb-6 rounded-sm border border-gr-danger/20 bg-gr-danger-bg px-4 py-3 text-sm text-gr-danger">
    {{ errorMessage() }}
  </div>
}

@if (loading()) {
  <p class="text-gr-sub">Cargando clientes...</p>
} @else {
  <app-data-table [columns]="columns()" [rows]="customers()" emptyMessage="No hay clientes registrados todavía." />
}

<ng-template #activeTpl let-customer>
  @if (customer.isActive) {
    <span class="rounded-full bg-gr-success-bg px-3 py-1 text-xs font-medium text-gr-success">Activo</span>
  } @else {
    <span class="rounded-full bg-gr-danger-bg px-3 py-1 text-xs font-medium text-gr-danger">Inactivo</span>
  }
</ng-template>

<ng-template #actionsTpl let-customer>
  <div class="flex items-center justify-end gap-3">
    <button type="button" (click)="openEditModal(customer)" class="cursor-pointer text-sm font-medium text-gr-primary transition hover:text-gr-gold">
      Editar
    </button>
    @if (canToggleActive()) {
      <button
        type="button"
        (click)="askToggleActive(customer)"
        [disabled]="updatingId() === customer.id"
        class="cursor-pointer text-sm font-medium transition disabled:cursor-not-allowed disabled:opacity-50"
        [class]="customer.isActive ? 'text-gr-sub hover:text-gr-danger' : 'text-gr-success hover:brightness-90'"
      >
        {{ customer.isActive ? 'Desactivar' : 'Activar' }}
      </button>
    }
  </div>
</ng-template>

@if (toggleTarget(); as customer) {
  <app-confirm-dialog
    [title]="customer.isActive ? 'Desactivar cliente' : 'Activar cliente'"
    [message]="(customer.isActive ? '¿Desactivar al cliente \'' : '¿Activar al cliente \'') + customer.name + '\'?'"
    [confirmLabel]="customer.isActive ? 'Desactivar' : 'Activar'"
    cancelLabel="Volver"
    [danger]="customer.isActive"
    [working]="updatingId() === customer.id"
    (close)="closeToggleConfirm()"
    (confirmed)="confirmToggleActive()"
  />
}
