<app-modal [title]="title()" size="sm" (close)="close.emit()">
  <p class="text-sm text-gr-sub">{{ message() }}</p>

  <div class="mt-6 flex items-center justify-end gap-3">
    <button
      type="button"
      (click)="close.emit()"
      [disabled]="working()"
      class="rounded-sm px-4 py-2.5 font-medium text-gr-sub transition hover:text-gr-text disabled:cursor-not-allowed disabled:opacity-60"
    >
      {{ cancelLabel() }}
    </button>
    <button
      type="button"
      (click)="confirmed.emit()"
      [disabled]="working()"
      class="flex items-center gap-2 rounded-sm px-5 py-2.5 font-semibold transition hover:brightness-95 disabled:cursor-not-allowed disabled:opacity-60"
      [class]="danger() ? 'bg-gr-danger-bg text-gr-danger' : 'bg-gr-primary-dark text-gr-primary-lite'"
    >
      @if (working()) {
        <svg class="h-4 w-4 animate-spin" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
        </svg>
      }
      {{ confirmLabel() }}
    </button>
  </div>
</app-modal>
