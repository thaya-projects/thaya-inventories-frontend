<div class="relative w-full">
  <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3.5">
    <svg class="h-4 w-4 text-gr-muted" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="7"/>
      <line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
  </div>
  <input
    type="text"
    [value]="value()"
    [placeholder]="placeholder()"
    (input)="onInput($event)"
    class="rounded-sm border border-gr-border bg-gr-surface pr-4 pl-10 text-gr-text placeholder-gr-muted transition focus:border-gr-primary focus:outline-none focus:ring-2 focus:ring-gr-primary/30"
    [class]="sizeClasses()"
  >
</div>
