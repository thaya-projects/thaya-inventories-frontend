<div class="h-full rounded-lg border border-gr-border bg-gr-surface p-5">
  <p class="flex items-center gap-1.5 text-xs font-semibold tracking-wide text-gr-sub uppercase">
    {{ label() }}
    @if (hint()) {
      <app-info-hint [text]="hint()!" />
    }
  </p>
  <p class="mt-2 text-3xl font-bold tabular-nums" [class]="valueClass()">{{ value() }}</p>
  @if (caption()) {
    <p class="mt-1 text-xs text-gr-sub">{{ caption() }}</p>
  }
</div>
