<div class="fixed inset-0 z-50 flex items-center justify-center bg-gr-text/50 p-4" (click)="close.emit()">
  <div class="w-full max-w-md rounded-lg bg-gr-surface p-6 shadow-lg" (click)="$event.stopPropagation()">
    <div class="mb-4 flex items-center justify-between">
      <h2 class="text-lg font-semibold text-gr-text">{{ title() }}</h2>
      <button
        type="button"
        (click)="close.emit()"
        aria-label="Cerrar"
        class="cursor-pointer rounded-sm p-1 text-gr-muted transition-colors hover:bg-gr-bg hover:text-gr-sub"
      >
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <ng-content />
  </div>
</div>
