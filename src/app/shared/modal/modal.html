<div class="fixed inset-0 z-50 flex items-center justify-center bg-gr-text/50 p-4" (click)="close.emit()">
  <div [class]="panelClass()" role="dialog" aria-modal="true" [attr.aria-labelledby]="titleId" (click)="$event.stopPropagation()">
    <div class="flex shrink-0 items-center justify-between px-6 pt-6 pb-2">
      <h2 [id]="titleId" class="text-lg font-semibold text-gr-text">{{ title() }}</h2>
      <button
        type="button"
        (click)="close.emit()"
        aria-label="Cerrar"
        class="cursor-pointer rounded-sm p-1 text-gr-muted transition-colors hover:bg-gr-bg hover:text-gr-sub"
      >
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <!-- Solo el cuerpo se desplaza; título y pie (si lo hay) quedan siempre a la vista. -->
    <div class="min-h-0 flex-1 overflow-y-auto px-6 pt-2 pb-6">
      <ng-content />
    </div>
    <ng-content select="[modalFooter]" />
  </div>
</div>
