@if (visible()) {
  <div class="relative">
    <input
      type="text" maxlength="40"
      [placeholder]="loading() ? 'Generando…' : 'Se genera al elegir el producto'"
      [value]="value()" [disabled]="disabled() || loading()"
      (input)="onInput($event)"
      class="w-full rounded-sm border border-gr-border bg-gr-surface px-4 py-2.5 text-gr-text placeholder-gr-muted transition focus:border-gr-primary focus:outline-none focus:ring-2 focus:ring-gr-primary/30 disabled:cursor-not-allowed disabled:opacity-60"
    >
    @if (loading()) {
      <svg class="absolute top-1/2 right-3 h-4 w-4 -translate-y-1/2 animate-spin text-gr-muted" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
      </svg>
    }
  </div>
}
