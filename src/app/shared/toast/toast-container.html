<div class="pointer-events-none fixed inset-x-0 top-4 z-[100] flex flex-col items-center gap-2 px-4">
  @for (toast of toastService.messages(); track toast.id) {
    <div
      class="pointer-events-auto rounded-sm px-4 py-3 text-sm font-medium shadow-lg"
      [class]="toast.tone === 'success' ? 'bg-gr-success-bg text-gr-success' : 'bg-gr-danger-bg text-gr-danger'"
    >
      {{ toast.text }}
    </div>
  }
</div>
