<div class="flex flex-wrap items-center justify-between gap-4 px-6 py-3.5 text-sm text-gr-sub">
  <span>
    Mostrando datos del <strong class="font-semibold text-gr-text">{{ rangeStart() }}</strong>
    al <strong class="font-semibold text-gr-text">{{ rangeEnd() }}</strong>
    de <strong class="font-semibold text-gr-text">{{ totalItems() }}</strong> registros
  </span>

  <div class="flex items-center gap-2">
    <span>Mostrar</span>
    <select
      [value]="pageSize()"
      (change)="onPageSizeChange($event)"
      class="rounded-sm border border-gr-border bg-gr-surface px-2.5 py-1.5 text-gr-text transition focus:border-gr-primary focus:outline-none focus:ring-2 focus:ring-gr-primary/30"
    >
      @for (size of pageSizeOptions(); track size) {
        <option [value]="size">{{ size }}</option>
      }
    </select>
    <span>por página</span>
  </div>

  <div class="flex items-center gap-1">
    <button
      type="button"
      (click)="pageChange.emit(currentPage() - 1)"
      [disabled]="currentPage() <= 1"
      aria-label="Página anterior"
      class="flex h-8 w-8 cursor-pointer items-center justify-center rounded-sm border border-gr-border text-gr-sub transition-colors hover:bg-gr-bg disabled:cursor-not-allowed disabled:opacity-40"
    >
      <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 6 9 12 15 18"/>
      </svg>
    </button>

    @for (item of pageItems(); track $index) {
      @if (item === '...') {
        <span class="px-2 text-gr-muted">…</span>
      } @else {
        <button
          type="button"
          (click)="pageChange.emit(item)"
          class="flex h-8 w-8 cursor-pointer items-center justify-center rounded-sm text-sm font-medium transition-colors"
          [class]="item === currentPage() ? 'bg-gr-primary-dark text-gr-primary-lite' : 'text-gr-sub hover:bg-gr-bg'"
        >
          {{ item }}
        </button>
      }
    }

    <button
      type="button"
      (click)="pageChange.emit(currentPage() + 1)"
      [disabled]="currentPage() >= totalPages()"
      aria-label="Página siguiente"
      class="flex h-8 w-8 cursor-pointer items-center justify-center rounded-sm border border-gr-border text-gr-sub transition-colors hover:bg-gr-bg disabled:cursor-not-allowed disabled:opacity-40"
    >
      <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 6 15 12 9 18"/>
      </svg>
    </button>
  </div>
</div>
