[build]
  command = "npm ci && npm run build"
  publish = "dist/thaya-inventories-frontend/browser"

[build.environment]
  NODE_VERSION = "22"

# Angular Router maneja las rutas en el cliente — sin esto, refrescar o entrar
# directo a una ruta como /inventory/products devuelve 404 de Netlify.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
